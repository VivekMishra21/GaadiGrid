server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src allows any https origin rather than pinning the exact backend host,
    # since VITE_API_BASE_URL is baked into the JS bundle at build time and this
    # static config can't read it — pin this to the real API origin once one is fixed
    # for a given deployment, for a tighter policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'" always;

    # Client-side routed SPA: any path that isn't a real static file falls back to
    # index.html so React Router-less state (this app switches views in-memory) and a
    # hard refresh on a deep link both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
