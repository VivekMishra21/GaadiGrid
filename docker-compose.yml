# Compose project name is set explicitly (not derived from the directory name) because another,
# unrelated GaadiGrid project exists on this machine in a different folder that also happens to be
# named "gaadigrid" — without this, Docker Compose would treat the two as the same project and their
# containers/volumes would collide. Do not remove this line.
name: gaadigrid_customer_app

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gaadigrid-customer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gaadigrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaadigrid_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gaadigrid}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gaadigrid_customer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gaadigrid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gaadigrid-customer-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - gaadigrid_customer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gaadigrid-customer-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gaadigrid}:${POSTGRES_PASSWORD:-gaadigrid_dev}@postgres:5432/${POSTGRES_DB:-gaadigrid}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Independent MongoDB used only by website/ (the marketing site's own Next.js + Prisma
  # backend). Deliberately not shared with the PostgreSQL data above. Prisma's MongoDB
  # connector requires a replica set (even single-node) for transactions, hence mongo-init.
  mongo:
    image: mongo:7
    container_name: gaadigrid-customer-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - gaadigrid_customer_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: gaadigrid-customer-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo:27017 --eval
      "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"

volumes:
  gaadigrid_customer_postgres_data:
  gaadigrid_customer_redis_data:
  gaadigrid_customer_mongo_data:
